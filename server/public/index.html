<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff8f6" />
<title>TwoChat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- auth screen -->
    <section class="screen" id="screen-auth" hidden>
      <div class="auth-wrap">
        <div class="badge">💬</div>
        <h1>TwoChat</h1>
        <p class="tagline">Nhắn tin thời gian thực cho hai người.<br />Tự host, không quảng cáo, không theo dõi.</p>

        <div class="tabs">
          <button class="tab is-active" data-mode="login">Đăng nhập</button>
          <button class="tab" data-mode="register">Tạo tài khoản</button>
        </div>

        <form id="auth-form" class="stack" autocomplete="on">
          <label class="field">
            <span>Tên đăng nhập</span>
            <input id="auth-username" name="username" autocapitalize="none" autocomplete="username" placeholder="vd: minh" required />
          </label>
          <label class="field" id="auth-displayname-field" hidden>
            <span>Tên hiển thị</span>
            <input id="auth-displayname" name="displayName" autocomplete="nickname" placeholder="vd: Minh" />
          </label>
          <label class="field">
            <span>Mật khẩu</span>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="Ít nhất 6 ký tự" required />
          </label>
          <button class="btn primary" id="auth-submit" type="submit">Đăng nhập</button>
          <p class="error" id="auth-error" role="alert"></p>
        </form>
      </div>
    </section>

    <!-- pair screen -->
    <section class="screen" id="screen-pair" hidden>
      <header class="topbar">
        <div class="avatar" id="pair-avatar">?</div>
        <div class="who">
          <b id="pair-name">Bạn</b>
          <span>Chưa ghép đôi</span>
        </div>
        <button class="icon-btn" id="pair-logout" title="Đăng xuất">⎋</button>
      </header>
      <div class="pair-wrap">
        <h2>Ghép đôi với người ấy</h2>
        <p class="muted">Gửi mã này cho người ấy, hoặc nhập mã của họ để kết nối.</p>

        <div class="code-card">
          <span class="code-label">Mã mời của bạn</span>
          <strong id="pair-code">······</strong>
          <button class="btn ghost small" id="pair-copy">Sao chép</button>
        </div>

        <form id="pair-form" class="stack">
          <label class="field">
            <span>Nhập mã của người ấy</span>
            <input id="pair-input" maxlength="6" autocapitalize="characters" placeholder="ABC123" />
          </label>
          <button class="btn primary" type="submit">Ghép đôi</button>
          <p class="error" id="pair-error" role="alert"></p>
        </form>
        <p class="hint" id="pair-waiting" hidden>Đang chờ người ấy xác nhận…</p>
      </div>
    </section>

    <!-- chat screen -->
    <section class="screen chat-screen" id="screen-chat" hidden>
      <header class="topbar">
        <div class="avatar" id="chat-avatar">?</div>
        <div class="who">
          <b id="chat-name">Người ấy</b>
          <span id="chat-status" class="muted">Ngoại tuyến</span>
        </div>
        <button class="icon-btn" id="chat-menu" title="Tuỳ chọn">⋮</button>
        <div class="menu" id="chat-menu-panel" hidden>
          <button id="menu-unpair">Huỷ ghép đôi</button>
          <button id="menu-logout">Đăng xuất</button>
        </div>
      </header>

      <div class="thread" id="thread"></div>

      <form class="composer" id="composer">
        <textarea id="composer-input" rows="1" placeholder="Nhắn gì đó…" maxlength="4000"></textarea>
        <button class="send" type="submit" id="send-btn" aria-label="Gửi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12 20 4.5 15.5 20l-3.7-5.6L4.5 12z"/></svg>
        </button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
