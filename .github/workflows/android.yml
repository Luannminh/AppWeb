name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew test --stacktrace 2>&1 | tee gradle.log

      - name: Assemble debug APK
        if: success()
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twchat-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Makes compiler/test output readable from the pull request itself, which
      # is handy when the job log is not reachable.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f gradle.log ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "### ❌ Android build failed"
              echo
              echo '```'
              grep -E "^(e: |w: |> Task .*FAILED|FAILURE:)" gradle.log | head -80
              grep -E "error:|tests? failed|Test .* FAILED" gradle.log | head -40
              echo '```'
              echo
              echo '```'
              grep -A8 "What went wrong" gradle.log | head -30
              echo '```'
            } > report.md
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -F body=@report.md
          fi
