name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          node src/index.js &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 0.25
          done
          echo "server did not start" && exit 1

      - name: REST + WebSocket smoke test
        run: npm run smoke
